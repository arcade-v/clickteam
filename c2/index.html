<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/arcade-v/clickteam/c2/">

    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="HandheldFriendly" content="true">

    <title>Five Nights at Candy's 2</title>

    <link id="game-style" rel="stylesheet" href="style.css">
    <link id="game-icon" rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-wrapper {
            width: min(100vw, 177.7778vh);
            height: min(56.25vw, 100vh);
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden;
        }

        #MMFCanvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border: 0;
            outline: none;
            touch-action: none;
        }

        #progress-container {
            position: absolute;
            z-index: 10;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(80%, 420px);
            color: white;
            font-family: 'Pixelify Sans', monospace !important;
            font-size: 14px;
        }

        #loading-error {
            display: none;
            position: fixed;
            z-index: 100;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(85%, 500px);
            padding: 16px;
            box-sizing: border-box;
            color: white;
            background: #251010;
            border: 1px solid #a33;
            border-radius: 8px;
            font-family: 'Pixelify Sans', monospace !important;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div id="game-wrapper">
        <canvas id="MMFCanvas" width="1280" height="720">
            Your browser does not support Canvas.
        </canvas>

        <div id="progress-container">
            <div style="margin-bottom:6px">
                Downloading... <span id="download-text">0%</span>
            </div>
            <div style="width:100%;background:#444;border-radius:6px;overflow:hidden">
                <div id="download-bar" style="height:10px;background:#3b82f6;width:0%;transition:width .2s"></div>
            </div>

            <div style="margin:12px 0 6px">
                Extracting... <span id="extract-text">0%</span>
            </div>
            <div style="width:100%;background:#444;border-radius:6px;overflow:hidden">
                <div id="extract-bar" style="height:10px;background:#10b981;width:0%;transition:width .2s"></div>
            </div>
        </div>
    </div>

    <div id="loading-error"></div>
<script>
(() => {
    const bases = [
        const cdnBases = [
            "https://cdn.jsdelivr.net/gh/arcade-v/clickteam/c1/",
            "https://fastly.jsdelivr.net/gh/arcade-v/clickteam/c1/",
            "https://testingcf.jsdelivr.net/gh/arcade-v/clickteam/c1/",
            "https://gcore.jsdelivr.net/gh/arcade-v/clickteam/c1/",
            "https://raw.githack.com/arcade-v/clickteam/main/c1/",
            "https://raw.githubusercontent.com/arcade-v/clickteam/main/c1/",
            "https://cdn.statically.io/gh/arcade-v/clickteam/c1/",
    ];

    function showError(message) {
        const error = document.getElementById("loading-error");
        error.textContent = message;
        error.style.display = "block";
        console.error(message);
    }

    // Load CSS and favicon with CDN fallbacks.
    function loadAsset(id, filename, attribute) {
        const element = document.getElementById(id);
        if (!element) return;

        let index = 0;

        function attempt() {
            if (index >= bases.length) {
                console.warn("Could not load asset:", filename);
                return;
            }

            const url = bases[index++] + filename;

            if (attribute === "href") {
                element.href = url;
            }

            element.onerror = attempt;
        }

        attempt();
    }

    // Load main.js with CDN fallbacks.
    function loadMainScript(index = 0) {
        if (index >= bases.length) {
            showError("Could not load main.js from any CDN. Check that the file exists.");
            return;
        }

        const script = document.createElement("script");
        script.src = bases[index] + "main.js";

        console.log("Attempting to load:", script.src);

        script.onload = () => {
            console.log("Successfully loaded:", script.src);
        };

        script.onerror = () => {
            console.warn("Failed to load:", script.src);
            script.remove();
            loadMainScript(index + 1);
        };

        document.body.appendChild(script);
    }

    // Load JSZip before main.js.
    function loadJSZip(index = 0) {
        const sources = [
            "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
            "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
        ];

        if (index >= sources.length) {
            showError("Could not load JSZip. Resource extraction cannot continue.");
            return;
        }

        const script = document.createElement("script");
        script.src = sources[index];

        script.onload = () => {
            console.log("JSZip loaded:", script.src);
            loadMainScript();
        };

        script.onerror = () => {
            console.warn("JSZip failed:", script.src);
            script.remove();
            loadJSZip(index + 1);
        };

        document.body.appendChild(script);
    }

    loadAsset("game-style", "style.css", "href");
    loadAsset("game-icon", "favicon.ico", "href");
    loadJSZip();
})();
</script>
</body>
</html>
